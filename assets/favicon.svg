<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0D2B4E"/>
  <!-- Balance beam vertical post -->
  <line x1="16" y1="5" x2="16" y2="27" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Horizontal beam -->
  <line x1="8" y1="9" x2="24" y2="9" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Left pan arc -->
  <path d="M8 9 Q5.5 15.5 8 18 Q10.5 18 12 15.5 Q13.5 13 12 9" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right pan arc (slightly lower = unbalanced/in motion) -->
  <path d="M24 9 Q21.5 16.5 24 19 Q26.5 19 28 16.5 Q29.5 14 28 9" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Base -->
  <line x1="12" y1="27" x2="20" y2="27" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
</svg>
